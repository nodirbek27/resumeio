<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- === SEO: Primary === -->
    <title>ResumeIO — Free Online Resume, CV & Cover Letter Builder</title>
    <meta name="description" content="Create a professional resume, CV, and cover letter online for free. Choose from modern templates with real-time preview. Download as PDF or Word — no sign-up required." />
    <meta name="keywords" content="resume builder, CV maker, create resume online, free resume templates, cover letter generator, resume PDF, resume Word, professional resume, online CV builder" />
    <meta name="author" content="ResumeIO" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#239f55" />
    <link rel="canonical" href="https://resumeio.uz/" />

    <!-- === Open Graph (Facebook, Telegram, social networks) === -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://resumeio.uz/" />
    <meta property="og:site_name" content="ResumeIO" />
    <meta property="og:title" content="ResumeIO — Free Online Resume, CV & Cover Letter Builder" />
    <meta property="og:description" content="Create a professional resume, CV, and cover letter online for free. Everything is saved on your device — no server, no sign-up." />
    <meta property="og:locale" content="en_US" />

    <!-- === Twitter Card === -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ResumeIO — Free Online Resume, CV & Cover Letter Builder" />
    <meta name="twitter:description" content="Create a professional resume, CV, and cover letter online for free. Everything is saved on your device." />

    <!-- === JSON-LD Structured Data === -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ResumeIO",
      "url": "https://resumeio.uz",
      "description": "A free tool to build a resume, CV, and cover letter. Download as PDF or Word.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "All",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "UZS"
      },
      "featureList": [
        "Resume / CV builder",
        "Cover letter builder",
        "Download as PDF",
        "Download as Word"
      ]
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
